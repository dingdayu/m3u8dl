# release-please: keeps a "release PR" up to date with the changelog and the
# next semver version (from Conventional Commits). Merging that PR creates a
# DRAFT GitHub release + tag and emits the tag/version outputs consumed by
# .github/workflows/release.yml (via workflow_call).
name: release-please

on:
  # This is a reusable workflow driven ONLY by release.yml (which triggers on
  # push to main). It deliberately has NO `on: push` of its own: running it
  # both standalone and via workflow_call would run release-please twice on
  # the same PR, racing on its labels (a released PR loses `autorelease:
  # pending`, and the second run then fails removing an already-gone label).
  workflow_call:
    outputs:
      release_created:
        description: "true if a release (draft) was created"
        value: ${{ jobs.release-please.outputs.release_created }}
      tag_name:
        description: "the release tag, e.g. v0.2.0"
        value: ${{ jobs.release-please.outputs.tag_name }}
      version:
        description: "the release version without the leading v, e.g. 0.2.0"
        value: ${{ jobs.release-please.outputs.version }}

permissions:
  contents: write # releases, tags
  pull-requests: write # release PRs

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp
        with:
          # A fine-grained PAT (not GITHUB_TOKEN) is passed here so the
          # release PR / draft release are attributed to the PAT owner (a real
          # user), not github-actions[bot]. This lets the release PR's events
          # trigger CI automatically and avoids the bot-PR workflow-approval
          # gate. Permissions needed: Contents + Pull requests (read/write).
          token: ${{ secrets.RELEASE_PLEASE_PAT }}
        # Config comes from release-please-config.json (draft: true) and
        # .release-please-manifest.json at the repo root.
