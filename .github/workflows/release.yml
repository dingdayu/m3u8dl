# Release workflow: triggered by pushing a version tag (e.g. v1.2.3).
# Builds cross-platform binaries with goreleaser and creates a GitHub Release.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    name: Release binaries
    runs-on: ubuntu-latest
    env:
      # Set to 'true' when the NPM_TOKEN secret is configured; checked below.
      NPM_TOKEN_SET: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required by goreleaser for full changelog

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Fetch dependencies
        run: go mod download

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Pack npm packages
        run: scripts/npm-pack.sh "${GITHUB_REF_NAME#v}"

      - name: Attest archive artifacts (.tar.gz / .zip)
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Attest checksums
        uses: actions/attest@v4
        with:
          subject-path: dist/checksums.txt

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN_SET == 'true' }}
        run: scripts/npm-publish.sh "${GITHUB_REF_NAME#v}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
