# Release workflow: triggered by pushing a version tag (e.g. v1.2.3).
# Builds cross-platform binaries with goreleaser and creates a GitHub Release.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # Detect whether the npm channel is configured, purely from the presence of
  # the NPM_TOKEN secret (no repo variable to keep in sync). Secrets cannot be
  # read in step-level `if:` conditions, so this check runs in its own job.
  npm-config:
    name: Check npm publish configuration
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Detect NPM_TOKEN
        id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -n "${NPM_TOKEN:-}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::NPM_TOKEN secret not set — skipping the npm channel for this release."
          fi

  goreleaser:
    name: Release binaries
    runs-on: ubuntu-latest
    needs: npm-config
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required by goreleaser for full changelog

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"

      - name: Fetch dependencies
        run: go mod download

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      # Snapshot build (no publish) to produce the dist/ binaries, then pack
      # the npm tarballs before the real release so a packaging failure aborts
      # the release instead of leaving a half-published tag.
      # Goreleaser shells out to the syft binary for the sboms section in
      # .goreleaser.yml; the goreleaser-action does not install it.
      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@v0.20.6

      - name: Build binaries (goreleaser snapshot)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record raw-binary checksums (bin-checksums.txt)
        run: scripts/bin-checksums.sh

      - name: Upload bin-checksums.txt to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/bin-checksums.txt --clobber

      - name: Pack npm packages
        if: needs.npm-config.outputs.enabled == 'true'
        run: scripts/npm-pack.sh "${GITHUB_REF_NAME#v}"

      - name: Publish to npm
        if: needs.npm-config.outputs.enabled == 'true'
        run: scripts/npm-publish.sh "${GITHUB_REF_NAME#v}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Attest archive artifacts (.tar.gz / .zip)
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Attest checksums (archives + raw binaries)
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/checksums.txt
            dist/bin-checksums.txt

      # The real release publishes the same binaries; dist/ (incl. the staged
      # npm tarballs) is left untouched.
      - name: Run GoReleaser (publish GitHub release)
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: latest
          args: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
