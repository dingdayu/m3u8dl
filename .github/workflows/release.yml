# Release workflow: single-build + publish, driven by release-please.
#
# Triggered by every push to main. It first calls the reusable
# .github/workflows/release-please.yml workflow, which keeps a release PR up
# to date and — when that PR is merged — creates a DRAFT GitHub release +
# tag. If a release was created, the build job below compiles the tagged
# commit ONCE (goreleaser --skip=publish), attests the artifacts, packs &
# publishes npm from the same dist/, and finally publishes the draft release
# with `gh`, uploading exactly the attested bytes.
#
# Everything is built exactly once, so the npm packages, bin-checksums.txt,
# the GitHub archives and the attestations all describe the same bytes — no
# rebuild, no cross-channel checksum drift. Any failure before the final
# `gh release edit --draft=false` leaves the release as a draft (invisible
# to users), so a tag can never be half-published.
name: release

on:
  push:
    branches:
      - main

# Serialize all release runs under a single stable global group. Never cancel
# an in-progress release: a partially published release must run to completion
# (or fail on its own) rather than be aborted mid-publish.
concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: write # releases, tags
  id-token: write # npm trusted publishing (OIDC) + sigstore
  attestations: write # GitHub artifact attestations
  # Required by the reusable release-please.yml (pull-requests: write) so it
  # can keep the release PR up to date. A caller's permissions block acts as
  # a ceiling for any reusable workflow it invokes; omitting this would cap
  # the callee at pull-requests: none and fail workflow validation.
  pull-requests: write # release PRs

jobs:
  # Run release-please (defined in its own workflow file) and read its
  # outputs to learn whether a release was created and at which tag.
  release-please:
    uses: ./.github/workflows/release-please.yml
    # Reusable workflows receive no caller secrets unless they are mapped
    # explicitly. Forward only the single secret the callee
    # (release-please.yml) needs — the fine-grained RELEASE_PLEASE_PAT used
    # as its token — instead of `secrets: inherit`, which would expose every
    # present and future repository secret to the callee.
    secrets:
      RELEASE_PLEASE_PAT: ${{ secrets.RELEASE_PLEASE_PAT }}

  build:
    name: Build, attest & publish
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      VERSION: ${{ needs.release-please.outputs.version }}
    steps:
      - name: Checkout (at release commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Checkout the commit that this run pushed (which is exactly the
          # commit release-please tagged its draft release against). We check
          # out by SHA rather than by tag: with draft:true the tag is created
          # immediately thanks to force-tag-creation, but pinning the SHA keeps
          # this step correct even if that tag creation ever lags or fails.
          ref: ${{ github.sha }}
          fetch-depth: 0 # required by goreleaser for git metadata

      # release-please creates the git tag immediately for its draft release
      # (force-tag-creation in release-please-config.json), which is what lets
      # the NEXT push-to-main run find this release boundary instead of
      # regenerating a stale changelog. This step is a defensive, idempotent
      # guarantee that refs/tags/$TAG exists and resolves to the release commit
      # so the later `gh release upload "$TAG"` and
      # `gh release edit "$TAG" --draft=false` steps can resolve it.
      #
      # Idempotent so this job can be rerun safely after a later release-stage
      # failure: if the tag already exists on origin it must resolve to this
      # run's release commit (fail loudly otherwise). An existing tag is
      # never moved, deleted or force-pushed — so when release-please already
      # created it, this step is a no-op verification.
      - name: Create release tag
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          ref="refs/tags/${TAG}"

          # Does the tag already exist on origin?
          existing_sha="$(git ls-remote origin "${ref}" \
            | awk -v r="${ref}" '$2 == r { print $1 }')"

          if [ -z "${existing_sha}" ]; then
            # Not there yet: create it at the release commit and push it.
            # If a concurrent run created the tag first, this non-force push
            # is rejected — an existing tag is never replaced.
            git tag "${TAG}" "${RELEASE_SHA}"
            git push origin "${ref}"
            echo "Created and pushed ${ref} at ${RELEASE_SHA}."
            exit 0
          fi

          # Tag exists: resolve it to the underlying commit. An annotated tag
          # peels via ${ref}^{}; a lightweight tag has no peeled entry, in
          # which case the ref itself already points at the commit.
          commit_sha="$(git ls-remote origin "${ref}^{}" \
            | awk -v r="${ref}^{}" '$2 == r { print $1 }')"
          if [ -z "${commit_sha}" ]; then
            commit_sha="${existing_sha}"
          fi

          if [ "${commit_sha}" != "${RELEASE_SHA}" ]; then
            echo "::error::Tag ${TAG} exists on origin but resolves to ${commit_sha}, not the release commit ${RELEASE_SHA}; refusing to move or replace it."
            exit 1
          fi

          echo "Tag ${TAG} already exists on origin and resolves to the release commit ${RELEASE_SHA}; nothing to do."

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.27.x"

      - name: Fetch dependencies
        run: go mod download

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node 24 bundles npm >= 11.5.1, required for trusted publishing.
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      # Goreleaser shells out to the syft binary for the sboms section in
      # .goreleaser.yml; the goreleaser-action does not install it.
      - name: Install syft (SBOM generator)
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # Build + archive + checksums + SBOMs exactly ONCE. --skip=publish
      # keeps everything in dist/ and creates no GitHub release of its own.
      - name: Build all artifacts (goreleaser, no publish)
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.0
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Raw-binary SHA-256 manifest for the npm/jsDelivr channel, built from
      # the same dist/ binaries.
      - name: Record raw-binary checksums (bin-checksums.txt)
        run: scripts/bin-checksums.sh

      # Attest the exact bytes that will be uploaded later.
      - name: Attest archive artifacts (.tar.gz / .zip)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip

      - name: Attest checksums (archives + raw binaries)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/checksums.txt
            dist/bin-checksums.txt

      # npm is published from the same dist/ binaries via trusted publishing
      # (OIDC): no long-lived npm token, provenance is automatic. A failure
      # here aborts the run while the GitHub release is still a draft —
      # nothing is half-published.
      - name: Pack npm packages
        run: scripts/npm-pack.sh "$VERSION"

      - name: Publish to npm
        run: scripts/npm-publish.sh "$VERSION"

      # Everything succeeded: upload exactly the attested artifacts to the
      # draft release and flip it to published. This is the only step that
      # makes the release public, so it runs last.
      - name: Publish GitHub release (upload artifacts, undraft)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" --clobber \
            dist/*.tar.gz dist/*.zip dist/*.sbom.json \
            dist/checksums.txt dist/bin-checksums.txt
          gh release edit "$TAG" --draft=false
