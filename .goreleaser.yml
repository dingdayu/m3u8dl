# .goreleaser.yml
# Release build configuration for m3u8dl.
# Docs: https://goreleaser.com
# GitHub Action that drives this: .github/workflows/release.yml
version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: m3u8dl
    main: .
    binary: m3u8dl
    # Reproducible builds: trim local paths and pin every timestamp to the
    # commit (never wall-clock build time), so the release workflow can
    # verify that the published archives are byte-identical to the attested
    # snapshot build. See .github/workflows/release.yml.
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
      - -X "main.version={{ .Version }}"
      - -X "main.commit={{ .Commit }}"
      - -X "main.date={{ .CommitDate }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - README.zh.md
      - LICENSE
      - SECURITY.md

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

# NOTE: no `release:` / `changelog:` sections here. The GitHub release and
# CHANGELOG.md are owned by release-please (see .github/workflows/release.yml
# and release-please-config.json); goreleaser only builds the artifacts
# (the workflow runs it with --skip=publish).

