# .goreleaser.yml
# Release build configuration for m3u8dl.
# Docs: https://goreleaser.com
# GitHub Action that drives this: .github/workflows/release.yml
version: 2

before:
  hooks:
    - go mod tidy
    - go vet ./...

builds:
  - id: m3u8dl
    main: .
    binary: m3u8dl
    ldflags:
      - -s -w
      - -X "main.version={{ .Version }}"
      - -X "main.commit={{ .Commit }}"
      - -X "main.date={{ .Date }}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - README.md
      - README.zh.md
      - LICENSE
      - SECURITY.md

checksum:
  name_template: "checksums.txt"

sboms:
  - artifacts: archive

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^refactor:"
      - "Merge pull request"
      - "Merge branch"

release:
  github:
    owner: dingdayu
    name: m3u8dl
  footer: |

    ---
    **Full Changelog**: https://github.com/dingdayu/m3u8dl/compare/{{ .PreviousTag }}...{{ .Tag }}

    Released with [goreleaser](https://goreleaser.com).

# Snap / breve / etc. removed to keep the config minimal and focused.
